name: Run AI Video Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-ai-video-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$MAGIC_HOUR_API_KEY" ]; then
            echo "Missing required repository secrets: TELEGRAM_BOT_TOKEN and/or MAGIC_HOUR_API_KEY." >&2
            exit 1
          fi
          echo "Required secrets are configured."
      - name: Run Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          BOT_OWNER_ID: ${{ secrets.BOT_OWNER_ID }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 21000s python -u bot.py
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "Bot reached its planned 5h50m polling window."
            exit 0
          fi
          exit "$status"
